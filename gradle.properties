# Tuned for constrained CI/sandbox machines: the Kotlin compiler runs inside the
# Gradle daemon so a 2 GB box does not have to host three separate JVMs.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
